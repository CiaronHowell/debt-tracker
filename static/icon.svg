<!-- BRIEF: Debt Tracker app icon; geometric snowball payoff path; deep green rounded square; three shrinking white balances; upward progress arrow; legible from 16px to 512px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">Debt Tracker</title>
  <desc id="description">Three shrinking snowballs following an upward payoff path</desc>
  <rect id="background" width="64" height="64" rx="16" fill="#146c4b" />
  <g id="progress-path" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 23c9 1 18-3 27-11" stroke-width="4" />
    <path d="m38 11 5 1-1 5" stroke-width="4" />
  </g>
  <g id="snowballs" fill="none" stroke="#ffffff" stroke-width="4">
    <circle cx="19" cy="44" r="8" />
    <circle cx="35" cy="34" r="5.5" />
    <circle cx="47" cy="24" r="3.5" />
  </g>
</svg>
